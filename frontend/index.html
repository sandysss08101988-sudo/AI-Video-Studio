<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }
        h1 { color: #4CAF50; }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #45a049; }
        #output { margin-top: 20px; padding: 10px; background-color: #1e1e1e; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🎬 AI Video Studio</h1>
    <p>Generate videos from text prompts!</p>

    <div>
        <label for="promptInput">Video Prompt:</label>
        <textarea id="promptInput" placeholder="Describe the video you want to generate..."></textarea>
        <button onclick="generateVideo()">Generate Video</button>
    </div>

    <div id="output">
        <p>Status: Ready</p>
    </div>

    <script>
        async function generateVideo() {
            const prompt = document.getElementById('promptInput').value;
            const outputDiv = document.getElementById('output');
            
            if (!prompt) {
                alert('Please enter a prompt!');
                return;
            }

            outputDiv.innerHTML = `<p>Status: Sending request to server...</p>`;

            try {
                // Adjust endpoint URL when hosting publicly
                const response = await fetch('http://127.0.0.1:8000/generate-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (response.ok) {
                    outputDiv.innerHTML = `
                        <p><strong>Status:</strong> ${data.status}</p>
                        <p><strong>Task ID:</strong> ${data.task_id}</p>
                        <p><strong>Message:</strong> ${data.message}</p>
                    `;
                } else {
                    outputDiv.innerHTML = `<p style="color:red;">Error: ${data.detail || 'Failed to generate'}</p>`;
                }
            } catch (err) {
                outputDiv.innerHTML = `<p style="color:orange;">Server connection failed. Make sure backend server is running.</p>`;
            }
        }
    </script>
</body>
</html>
