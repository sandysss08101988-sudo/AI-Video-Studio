<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            background-color: #121212;
            color: #ffffff;
        }
        h1 { color: #4CAF50; font-size: 24px; margin-bottom: 5px; }
        .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
        .tab-btn {
            padding: 10px 15px;
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 5px;
        }
        .tab-btn.active { background: #4CAF50; border-color: #4CAF50; }
        .section { display: none; margin-top: 15px; }
        .section.active { display: block; }
        textarea, select, input {
            width: 100%;
            height: 90px;
            margin: 8px 0;
            padding: 10px;
            box-sizing: border-box;
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
        }
        select, input { height: 40px; }
        button.action-btn {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        #output {
            margin-top: 20px;
            padding: 12px;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 4px;
            word-break: break-word;
        }
        .config-box {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #1a1a1a;
            border-radius: 4px;
            border: 1px dashed #444;
        }
    </style>
</head>
<body>
    <h1>🎬 AI Video Studio</h1>
    <p class="sub">Generate AI videos & audio straight from your browser</p>

    <!-- Backend URL Config -->
    <div class="config-box">
        <label style="font-size: 12px; color: #aaa;">Backend API Server URL:</label>
        <input type="text" id="apiBaseUrl" value="http://127.0.0.1:8000" placeholder="e.g. https://your-app.onrender.com">
    </div>

    <div>
        <button class="tab-btn active" onclick="switchTab('video')">Video Gen</button>
        <button class="tab-btn" onclick="switchTab('audio')">Voiceover Gen</button>
    </div>

    <!-- Video Tab -->
    <div id="videoTab" class="section active">
        <label>Video Prompt:</label>
        <textarea id="videoPrompt" placeholder="A futuristic cyberpunk city at night with neon lights..."></textarea>
        
        <label>Aspect Ratio:</label>
        <select id="aspectRatio">
            <option value="16:9">16:9 (Landscape)</option>
            <option value="9:16">9:16 (Portrait / Reels)</option>
            <option value="1:1">1:1 (Square)</option>
        </select>
        
        <button class="action-btn" onclick="generateVideo()">Generate Video</button>
    </div>

    <!-- Audio Tab -->
    <div id="audioTab" class="section">
        <label>Voiceover Script:</label>
        <textarea id="audioText" placeholder="Welcome to AI Video Studio. Create amazing content in seconds..."></textarea>
        
        <label>Voice Style:</label>
        <select id="voiceSelect">
            <option value="alloy">Alloy (Neutral)</option>
            <option value="echo">Echo (Male)</option>
            <option value="fable">Fable (Narrative)</option>
        </select>
        
        <button class="action-btn" onclick="generateAudio()">Generate Voiceover</button>
    </div>

    <div id="output">
        <p><strong>Status:</strong> Ready</p>
    </div>

    <script>
        function getApiBase() {
            return document.getElementById('apiBaseUrl').value.replace(/\/$/, '');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            
            if (tab === 'video') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('videoTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('audioTab').classList.add('active');
            }
        }

        async function sendRequest(endpoint, payload) {
            const outputDiv = document.getElementById('output');
            const baseUrl = getApiBase();
            outputDiv.innerHTML = `<p>⏳ Sending request to <code>${baseUrl}${endpoint}</code>...</p>`;

            try {
                const response = await fetch(`${baseUrl}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok) {
                    outputDiv.innerHTML = `
                        <p><strong>Status:</strong> ${data.status}</p>
                        <p><strong>Task ID:</strong> ${data.task_id}</p>
                        <p><strong>Message:</strong> ${data.message}</p>
                        ${data.output_url ? `<p><strong>Link:</strong> <a href="${data.output_url}" target="_blank" style="color:#4CAF50;">View Output</a></p>` : ''}
                    `;
                } else {
                    outputDiv.innerHTML = `<p style="color:#ff5252;">Error: ${data.detail || 'Request failed'}</p>`;
                }
            } catch (err) {
                outputDiv.innerHTML = `<p style="color:#ff9800;">Server Connection Failed. Check if backend URL is correct and server is live.</p>`;
            }
        }

        function generateVideo() {
            const prompt = document.getElementById('videoPrompt').value;
            const aspect_ratio = document.getElementById('aspectRatio').value;
            if (!prompt) return alert('Enter a prompt!');
            sendRequest('/generate-video', { prompt, aspect_ratio });
        }

        function generateAudio() {
            const text = document.getElementById('audioText').value;
            const voice = document.getElementById('voiceSelect').value;
            if (!text) return alert('Enter text!');
            sendRequest('/generate-audio', { text, voice });
        }
    </script>
</body>
</html>
